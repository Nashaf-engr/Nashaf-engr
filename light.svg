        <g transform="translate(42 0)"><rect x="3" y="3" width="26" height="26" rx="6"/><path d="M10 14v9M10 10v.1M16 23v-6c0-3 2-5 5-5s5 2 5 6v5"/></g>
        <g transform="translate(84 0)"><path d="M29 8c-1 1-3 2-5 2 2-1 3-3 3-5-2 1-4 2-6 3-5-5-14-1-13 6-5 0-9-2-12-6-2 4 0 8 3 10-2 0-3-1-4-1 0 4 3 7 7 8-1 1-3 1-4 1 1 4 4 6 8 6-4 3-8 4-13 4 5 3 10 5 16 5 19 0 29-16 29-29v-1c2-1 3-2 5-4z" transform="scale(.8) translate(3 3)"/></g>
        <g transform="translate(126 0)"><circle cx="16" cy="16" r="14"/><path d="M10 20c5-8 9-8 12 0M10 12h12M16 8v16"/></g>
      </g> -->
